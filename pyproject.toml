
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crystalytics-py"
version = "0.1.0"
description = "Crystallographic lattice and crystal structure analysis"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["crystalytics_py*"]
namespaces = false
